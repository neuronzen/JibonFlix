<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Episode 01 — JibonFlix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <span class="logo-icon">J</span>
        <span>Jibon<span>Flix</span></span>
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="anime-list.html">Anime</a>
    </nav>

</header>


<main>

<section class="watch-section">

    <div class="breadcrumb">
        <a href="index.html">Home</a>
        <span>›</span>
        <a href="#" id="breadcrumbAnime">Anime</a>
        <span>›</span>
        <strong id="breadcrumbEpisode">Episode 01</strong>
    </div>


    <div class="video-container">

        <div class="video-player-box">

            <div class="video-watermark">
                JibonFlix
            </div>

            <video
                class="real-player"
                id="videoPlayer"
                controls
                playsinline
                preload="metadata"
            >
                Your browser does not support HTML5 video.
            </video>

        </div>

    </div>


    <div class="watch-info">

        <div>
            <span class="section-label" id="episodeAnimeTitle">
                ANIME
            </span>

            <h1 id="episodeTitle">Episode 01</h1>

            <p class="episode-meta" id="episodeMeta">
                Loading...
            </p>
        </div>


        <div class="watch-actions">

            <a
                class="action-button"
                id="downloadButton"
                href="#"
                download
            >
                ↓ Download
            </a>

            <button onclick="shareEpisode()">
                🔗 Share
            </button>

        </div>

    </div>


    <div class="episode-navigation">

        <a href="#" class="nav-episode previous-episode disabled" id="previousEpisode">
            ← Previous
        </a>

        <a href="#" class="nav-episode" id="episodeListButton">
            Episode List
        </a>

        <a href="#" class="nav-episode next-episode" id="nextEpisode">
            Next →
        </a>

    </div>


    <section class="section watch-episodes">

        <div class="section-header">
            <div>
                <span class="section-label" id="moreEpisodesLabel">
                    ANIME
                </span>
                <h2>More Episodes</h2>
            </div>
        </div>


        <div class="episode-grid" id="moreEpisodes">
            <p>Loading episodes...</p>
        </div>

    </section>

</section>

</main></main>


<footer>

    <div class="footer-logo">JibonFlix</div>

    <div class="developer-credit">
        <span>Created & Developed by</span>
        <strong>Jubayer Ahmmed Jibon</strong>
    </div>

    <div class="copyright">
        © 2026 JibonFlix. All rights reserved.
    </div>

</footer>


<div id="toast"></div>

<script src="app.js"></script>


<script>

const params = new URLSearchParams(window.location.search);
const animeKey = params.get("anime") || "";
const episodeNumber = Number(params.get("ep")) || 1;

const videoPlayer = document.getElementById("videoPlayer");
const episodeTitle = document.getElementById("episodeTitle");
const episodeMeta = document.getElementById("episodeMeta");
const episodeAnimeTitle = document.getElementById("episodeAnimeTitle");
const breadcrumbAnime = document.getElementById("breadcrumbAnime");
const breadcrumbEpisode = document.getElementById("breadcrumbEpisode");
const episodeListButton = document.getElementById("episodeListButton");
const previousEpisode = document.getElementById("previousEpisode");
const nextEpisode = document.getElementById("nextEpisode");
const moreEpisodes = document.getElementById("moreEpisodes");
const moreEpisodesLabel = document.getElementById("moreEpisodesLabel");
const downloadButton = document.getElementById("downloadButton");

let currentAnime = null;
let currentEpisode = null;

async function loadEpisode() {

    try {

        const response = await fetch("/api/catalog");

        if (!response.ok) {
            throw new Error("Catalog request failed");
        }

        const data = await response.json();

        currentAnime = data.anime.find(item => item.id === animeKey);

        if (!currentAnime) {
            throw new Error("Anime not found");
        }

        currentEpisode =
            currentAnime.episodes.find(
                episode => episode.number === episodeNumber
            );

        if (!currentEpisode) {
            throw new Error("Episode not found");
        }

        const title = currentAnime.title;

        const sizeMB =
            Math.round(currentEpisode.size / (1024 * 1024));

        const episodeLabel =
            `Episode ${String(currentEpisode.number).padStart(2, "0")}`;

        document.title =
            `${episodeLabel} — ${title} — JibonFlix`;

        episodeAnimeTitle.textContent =
            title.toUpperCase();

        moreEpisodesLabel.textContent =
            title.toUpperCase();

        episodeTitle.textContent =
            episodeLabel;

        episodeMeta.textContent =
            `${currentEpisode.filename.toLowerCase().endsWith(".mkv") ? "1080p" : "1080p"} • ${sizeMB} MB`;

        breadcrumbAnime.textContent = title;

        breadcrumbAnime.href =
            `anime.html?anime=${encodeURIComponent(animeKey)}`;

        breadcrumbEpisode.textContent =
            episodeLabel;

        episodeListButton.href =
            `anime.html?anime=${encodeURIComponent(animeKey)}`;

        videoPlayer.innerHTML = "";
        videoPlayer.src = currentEpisode.video;
        videoPlayer.load();

        downloadButton.href =
            currentEpisode.video;

        setupNavigation();

        renderMoreEpisodes();

    } catch (error) {

        console.error("JibonFlix episode error:", error);

        episodeTitle.textContent =
            "Episode unavailable";

        episodeMeta.textContent =
            "This episode is not available";

        moreEpisodes.innerHTML =
            "<p>Unable to load episode right now.</p>";

    }
}

function getVideoType(filename) {

    const extension =
        filename.split(".").pop().toLowerCase();

    if (extension === "mkv") {
        return "video/x-matroska";
    }

    if (extension === "webm") {
        return "video/webm";
    }

    return "video/mp4";
}

function setupNavigation() {

    const episodes =
        currentAnime.episodes;

    const currentIndex =
        episodes.findIndex(
            episode => episode.number === episodeNumber
        );

    if (currentIndex > 0) {

        const previous =
            episodes[currentIndex - 1];

        previousEpisode.href =
            `episode.html?anime=${encodeURIComponent(animeKey)}&ep=${previous.number}`;

        previousEpisode.classList.remove("disabled");

    } else {

        previousEpisode.href = "#";
        previousEpisode.classList.add("disabled");

    }

    if (currentIndex < episodes.length - 1) {

        const next =
            episodes[currentIndex + 1];

        nextEpisode.href =
            `episode.html?anime=${encodeURIComponent(animeKey)}&ep=${next.number}`;

        nextEpisode.classList.remove("disabled");

    } else {

        nextEpisode.href = "#";
        nextEpisode.classList.add("disabled");

    }
}

function renderMoreEpisodes() {

    moreEpisodes.innerHTML =
        currentAnime.episodes.map(episode => {

            const sizeMB =
                Math.round(episode.size / (1024 * 1024));

            const number =
                String(episode.number).padStart(2, "0");

            const active =
                episode.number === episodeNumber
                    ? " active"
                    : "";

            return `
                <a
                    class="episode-card${active}"
                    href="episode.html?anime=${encodeURIComponent(animeKey)}&ep=${episode.number}"
                >

                    <span>${number}</span>

                    <div>
                        <strong>Episode ${number}</strong>
                        <small>1080p • ${sizeMB} MB</small>
                    </div>

                    <b>▶</b>

                </a>
            `;

        }).join("");
}

loadEpisode();

</script>

</body>


</html>
