<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jibon Adventure — JibonFlix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <a href="index.html" class="logo">
        <span class="logo-icon">J</span>
        <span>Jibon<span>Flix</span></span>
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="anime-list.html">Anime</a>
    </nav>
</header>


<main>

<section class="anime-hero">

    <div class="anime-cover poster-five">
        <div class="poster-title" id="animePosterTitle">
            LOADING
        </div>
        <span class="status" id="animeStatus">NEW</span>
    </div>

    <div class="anime-description">

        <span class="section-label" id="animeLabel">
            JIBONFLIX
        </span>

        <h1 id="animeTitle">Loading...</h1>

        <div class="anime-meta" id="animeMeta">
            <span>Loading...</span>
        </div>

        <p id="animeDescription">
            Loading anime information...
        </p>

        <div class="genres" id="animeGenres">
        </div>

        <div class="anime-actions">
            <a href="#" class="watch-button" id="watchButton">
                <span class="watch-icon">▶</span>
                <span>Watch Now</span>
            </a>
        </div>

    </div>

</section>


<section class="section">

    <div class="section-header">
        <div>
            <span class="section-label">SEASON 01</span>
            <h2>Episodes</h2>
        </div>
    </div>

    <div class="episode-grid" id="episodeGrid">
        <p>Loading episodes...</p>
    </div>

</section>

</main></main>


<footer>

    <div class="footer-logo">JibonFlix</div>

    <div class="developer-credit">
        <span>Created & Developed by</span>
        <strong>Jubayer Ahmmed Jibon</strong>
    </div>

    <div class="copyright">
        © 2026 JibonFlix. All rights reserved.
    </div>

</footer>




<script>

const params = new URLSearchParams(window.location.search);
const animeKey = params.get("anime") || "";

const animeTitle = document.getElementById("animeTitle");
const animeLabel = document.getElementById("animeLabel");
const animeMeta = document.getElementById("animeMeta");
const animeDescription = document.getElementById("animeDescription");
const animeGenres = document.getElementById("animeGenres");
const animePosterTitle = document.getElementById("animePosterTitle");
const animeStatus = document.getElementById("animeStatus");
const watchButton = document.getElementById("watchButton");
const episodeGrid = document.getElementById("episodeGrid");

async function loadAnime() {

    try {

        const response = await fetch("/api/catalog");

        if (!response.ok) {
            throw new Error("Catalog request failed");
        }

        const data = await response.json();

        const anime = data.anime.find(item => item.id === animeKey);

        if (!anime) {
            throw new Error("Anime not found");
        }

        const title = anime.title;

        const titleWords = title.toUpperCase().split(" ");

        if (titleWords.length >= 2) {
            animePosterTitle.innerHTML =
                `${titleWords.slice(0, -1).join("<br>")}<br>${titleWords[titleWords.length - 1]}`;
        } else {
            animePosterTitle.textContent = title.toUpperCase();
        }

        animeTitle.textContent = title;

        animeLabel.textContent =
            `ANIME • ${new Date(anime.episodes[0].uploaded).getFullYear()}`;

        animeMeta.innerHTML = `
            <span>${anime.episodeCount} Episodes</span>
            <span>•</span>
            <span>1080p</span>
        `;

        animeDescription.textContent =
            `Watch ${title} episodes on JibonFlix.`;

        animeGenres.innerHTML =
            `<span>Anime</span>`;

        document.title =
            `${title} — JibonFlix`;

        if (anime.episodes.length > 0) {

            const firstEpisode = anime.episodes[0].number;

            watchButton.href =
                `episode.html?anime=${encodeURIComponent(animeKey)}&ep=${firstEpisode}`;

        }

        episodeGrid.innerHTML =
            anime.episodes.map(episode => {

                const sizeMB =
                    Math.round(episode.size / (1024 * 1024));

                return `
                    <a
                        class="episode-card"
                        href="episode.html?anime=${encodeURIComponent(animeKey)}&ep=${episode.number}"
                    >

                        <span>
                            ${String(episode.number).padStart(2, "0")}
                        </span>

                        <div>
                            <strong>
                                Episode ${String(episode.number).padStart(2, "0")}
                            </strong>

                            <small>
                                1080p • ${sizeMB} MB
                            </small>
                        </div>

                        <b>▶</b>

                    </a>
                `;

            }).join("");

    } catch (error) {

        console.error("JibonFlix anime error:", error);

        animeTitle.textContent = "Anime unavailable";

        episodeGrid.innerHTML =
            "<p>Unable to load anime right now.</p>";
    }
}

loadAnime();

</script>

</body>
</html>
